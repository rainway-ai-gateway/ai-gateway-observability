# ============================================================
# BFE Observability - Doris Setup Configuration
# ============================================================
# 修改以下配置以匹配你的环境，然后运行 setup.sh
# ============================================================

# --- Kafka 连接信息 ---
# Routine Load 消费的 Kafka 集群地址（多个用逗号分隔）
KAFKA_BROKER_LIST=172.18.1.244:9092
# LogReader 发送日志的 Kafka Topic
KAFKA_TOPIC=bfe_ai_log_test
# Routine Load 的 consumer group id
KAFKA_GROUP_ID=doris_bfe_ai_log_test
# Routine Load 的 client id
KAFKA_CLIENT_ID=doris_bfe_ai_log_test

# --- Doris FE 连接信息 ---
DORIS_HOST=172.18.1.244
DORIS_PORT=9030
DORIS_USER=root
DORIS_PASSWORD=
# 目标数据库名（脚本会自动创建；需为合法标识符：字母/数字/下划线）
DORIS_DATABASE=bfe_observability_test

# --- 分区初始值 ---
# 动态分区会自动创建和管理分区，此处仅需一个初始分区作为起点
# 建议设置为部署日期前一天的日期
INIT_PARTITION_DATE=2026-07-10