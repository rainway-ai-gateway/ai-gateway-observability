# 修改以下配置以匹配你的环境，然后运行 setup.sh
# ============================================================

# --- Grafana 安装目录（必须修改为你的实际路径）---
GRAFANA_DIR=/home/work/grafana-v11.5.1

# --- Doris 数据源连接信息 ---
DORIS_HOST=172.18.1.244
DORIS_PORT=9030
DORIS_DATABASE=bfe_observability
DORIS_USER=root
DORIS_PASSWORD=

# --- 数据源名称与 UID ---
# 面板中 ${DS_DORIS} 占位符会替换为下面的 UID
DATASOURCE_NAME=Doris
DATASOURCE_UID=doris
