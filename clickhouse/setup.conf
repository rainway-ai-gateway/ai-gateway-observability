# ============================================================
# BFE Observability - ClickHouse Setup Configuration
# ============================================================
# 修改以下配置以匹配你的环境，然后运行 setup.sh
# ============================================================

# --- Kafka 连接信息 ---
# Kafka 引擎表消费的 Kafka 集群地址（多个用逗号分隔）
KAFKA_BROKER_LIST=172.18.1.244:9092
# LogReader 发送日志的 Kafka Topic
KAFKA_TOPIC=bfe_ai_log
# Kafka 引擎的消费 group id（必须与 Doris / StarRocks 链路的消费组不同）
KAFKA_GROUP_ID=clickhouse_bfe_ai_log

# --- ClickHouse 连接信息 ---
# native TCP 端口（默认 9000；HTTP 端口 8123 由 clickhouse-client 内部使用）
CLICKHOUSE_HOST=172.18.1.244
CLICKHOUSE_PORT=9000
CLICKHOUSE_USER=default
CLICKHOUSE_PASSWORD=
# 目标数据库名（脚本会自动创建；需为合法标识符：字母/数字/下划线）
CLICKHOUSE_DATABASE=bfe_observability
