#!/usr/bin/env bash
# ============================================================
# BFE Observability - StarRocks Setup Configuration
# ============================================================
# 修改以下配置以匹配你的环境，然后运行 setup.sh
# ============================================================

# --- Kafka 连接信息 ---
# Routine Load 消费的 Kafka 集群地址（多个用逗号分隔）
KAFKA_BROKER_LIST=172.18.1.244:9092
# LogReader 发送日志的 Kafka Topic
KAFKA_TOPIC=bfe_ai_log
# Routine Load 的 consumer group id（必须与 Doris 链路的 group.id 不同）
KAFKA_GROUP_ID=starrocks_bfe_ai_log
# Routine Load 的 client id
KAFKA_CLIENT_ID=starrocks_bfe_ai_log

# --- StarRocks FE 连接信息（MySQL 协议端口） ---
# 本机测试环境为 WSL2 内 StarRocks 3.5.21，经 localhost 转发访问
STARROCKS_HOST=127.0.0.1
STARROCKS_PORT=9030
STARROCKS_USER=root
STARROCKS_PASSWORD=
# 目标数据库名（脚本会自动创建；需为合法标识符：字母/数字/下划线）
STARROCKS_DATABASE=bfe_observability

# --- 分区初始值 ---
# 动态分区会自动创建和管理分区，此处仅需一个初始分区作为起点
# 建议设置为部署日期前一天的日期
INIT_PARTITION_DATE=2026-10-02
